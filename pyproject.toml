[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-pic-compiler"
version = "0.2.6"
description = "Local trip media compiler: sanitize, curate by taste, build a presentation draft"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "trip-pic-compiler contributors" }]
dependencies = [
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "ImageHash>=4.3.1",
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pillow-heif>=0.16.0",
]

[project.scripts]
trip-compile = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["../presentation/template/*"]
